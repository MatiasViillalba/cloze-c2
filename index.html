<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Cloze C2 — Cambridge Proficiency Trainer</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="description" content="Entrenador offline de Open Cloze para el examen Cambridge C2 Proficiency (CPE).">
<meta name="theme-color" content="#08080B">
<meta name="color-scheme" content="dark">

<!-- iOS standalone -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cloze C2">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/screens.css">
<link rel="stylesheet" href="assets/css/animations.css">
</head>
<body>

<div class="aurora" aria-hidden="true">
  <span class="aurora__blob aurora__blob--a"></span>
  <span class="aurora__blob aurora__blob--b"></span>
  <span class="aurora__blob aurora__blob--c"></span>
  <span class="aurora__grain"></span>
</div>

<div id="app" class="app">

  <header class="topbar" id="topbar">
    <button class="topbar__back" id="btnBack" type="button" aria-label="Volver">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar__title" id="topbarTitle">Cloze<span>C2</span></div>
    <div class="topbar__right" id="topbarRight">
      <span class="streak-pill" id="streakPill" title="Racha de días">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2s5 4.5 5 9a5 5 0 0 1-10 0c0-1.6.7-3 1.5-4C8.8 8.6 9 10 10 10c1.2 0 1.4-1.5 1-3-.4-1.7 1-5 1-5z" fill="currentColor"/><path d="M12 22a6 6 0 0 0 6-6c0-1.2-.3-2.4-.8-3.4A7 7 0 0 1 12 22z" fill="currentColor" opacity=".45"/></svg>
        <b id="streakCount">0</b>
      </span>
    </div>
  </header>

  <main id="screens" class="screens">
    <section class="screen" id="screen-home" data-screen="home"></section>
    <section class="screen" id="screen-cloze" data-screen="cloze"></section>
    <section class="screen" id="screen-drill" data-screen="drill"></section>
    <section class="screen" id="screen-result" data-screen="result"></section>
    <section class="screen" id="screen-mistakes" data-screen="mistakes"></section>
    <section class="screen" id="screen-weak" data-screen="weak"></section>
    <section class="screen" id="screen-library" data-screen="library"></section>
    <section class="screen" id="screen-stats" data-screen="stats"></section>
    <section class="screen" id="screen-settings" data-screen="settings"></section>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Navegación principal">
    <button class="tab is-active" data-go="home" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.2 12 4l8 7.2V20a1 1 0 0 1-1 1h-4.5v-5.5h-5V21H5a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-go="library" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h6v16H5zM13 4h6v16h-6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      <span>Textos</span>
    </button>
    <button class="tab tab--cta" data-go="smart" type="button" aria-label="Sesión inteligente">
      <span class="tab__cta"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4.5 13.5H11L10 22l8.5-11.5H12z" fill="currentColor"/></svg></span>
    </button>
    <button class="tab" data-go="stats" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19V10M12 19V5M19 19v-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>Progreso</span>
    </button>
    <button class="tab" data-go="settings" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3m13.4-6.4-1.6 1.6M9.2 14.8l-1.6 1.6m0-11.2 1.6 1.6m5.6 5.6 1.6 1.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>Ajustes</span>
    </button>
  </nav>

</div>

<div class="toast-host" id="toastHost" aria-live="polite"></div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet__scrim" data-close="1"></div>
  <div class="sheet__panel" role="dialog" aria-modal="true">
    <div class="sheet__grab"></div>
    <div class="sheet__body" id="sheetBody"></div>
  </div>
</div>

<script src="assets/js/version.js"></script>
<script src="assets/js/core/util.js"></script>
<script src="assets/js/core/sync-config.js"></script>
<script src="assets/js/core/store.js"></script>
<script src="assets/js/core/sync.js"></script>
<script src="assets/js/core/srs.js"></script>
<script src="assets/js/core/words.js"></script>
<script src="assets/js/core/content.js"></script>
<script src="assets/js/data/passages-01.js"></script>
<script src="assets/js/data/passages-02.js"></script>
<script src="assets/js/data/passages-03.js"></script>
<script src="assets/js/data/passages-04.js"></script>
<script src="assets/js/data/passages-05.js"></script>
<script src="assets/js/data/passages-06.js"></script>
<script src="assets/js/data/passages-07.js"></script>
<script src="assets/js/data/passages-08.js"></script>
<script src="assets/js/data/drills-01.js"></script>
<script src="assets/js/data/drills-02.js"></script>
<script src="assets/js/data/drills-03.js"></script>
<script src="assets/js/data/drills-04.js"></script>
<script src="assets/js/data/drills-05.js"></script>
<script src="assets/js/data/drills-06.js"></script>
<script src="assets/js/ui/toast.js"></script>
<script src="assets/js/ui/home.js"></script>
<script src="assets/js/ui/cloze.js"></script>
<script src="assets/js/ui/drill.js"></script>
<script src="assets/js/ui/result.js"></script>
<script src="assets/js/ui/mistakes.js"></script>
<script src="assets/js/ui/weak.js"></script>
<script src="assets/js/ui/library.js"></script>
<script src="assets/js/ui/stats.js"></script>
<script src="assets/js/ui/settings.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
